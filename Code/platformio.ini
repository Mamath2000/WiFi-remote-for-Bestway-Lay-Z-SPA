; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
data_dir = datazip
; default_envs = nodemcuv2
; default_envs = esp32s3-zero

[env:nodemcuv2]
platform = https://github.com/platformio/platform-espressif8266.git
board = nodemcuv2
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@6.21.2 ; v7 is using more memory
	; mcxiaoke/ESPDateTime
	links2004/WebSockets
	knolleary/PubSubClient
	me-no-dev/ESPAsyncTCP
	; khoih-prog/ESP_WifiManager@^1.12.1
    ; tzapu/WifiManager
    ; https://github.com/dok-net/ghostl ; << Fix missing circular_queue.h in plerup/EspSoftwareSerial@8.2.0
	plerup/EspSoftwareSerial
	milesburton/DallasTemperature
board_build.filesystem = littlefs
extra_scripts = gzip_littlefs.py
monitor_speed = 76800
board_build.f_cpu = 160000000L
; board_build.f_flash = 80000000L;
; upload_speed = 921600 ; enable if you device are capable
build_flags = 
    -DFILTER_6W_SPIKES=1
    ; -DBWC_DEBUGGING=BWC_DEBUG_OUTPUT_OFF
    -DBWC_DEBUGGING=BWC_DEBUG_OUTPUT_SERIAL
    ; -DBWC_DEBUGGING=BWC_DEBUG_OUTPUT_FILE
    -DBWC_SPRINKLE_YIELDS ;Yeah yeah, some call it a band aid but you do what you gotta do, right?
	-DWEBSOCKETS_NETWORK_TYPE="NETWORK_ESP8266_ASYNC"
    -DWEBSOCKETS_SAVE_RAM
    ; -DDEBUG_ESP_PORT=Serial ; adds around 800 bytes to iram (.text1)
    ; -D BUILDTIME=$UNIX_TIME
    ; -DDEBUG_ESP_SSL
    ; -DDEBUG_ESP_TLS_MEM
    ; -DDEBUG_ESPHTTP_CLIENT
    ; -DDEBUG_ESP_HTTP_UPDATE
    ; -DDEBUG_ESP_OOM
    ; -DDEBUG_ESP_MMU
    ; -include "umm_malloc/umm_malloc_cfg.h"
	; -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
    -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
    ; -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM32_SECHEAP_NOTSHARED
    ; -D PIO_FRAMEWORK_ARDUINO_MMU_CUSTOM
    ; -D MMU_IRAM_SIZE=0xC000
    ; -D MMU_ICACHE_SIZE=0x4000
    ; -D MMU_IRAM_HEAP    
    -DVTABLES_IN_FLASH
    ; -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    ; -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    ; -D BEARSSL_SSL_BASIC
    ; -Wl,-Map,output.map
; build_type = debug
; debug_build_flags = -Og -g2 -ggdb2
monitor_filters = 
	esp8266_exception_decoder
	default
    ; log2file
; upload_protocol = esptool
upload_protocol = espota
; upload_port = 192.168.90.157
upload_port = 192.168.90.167
upload_flags = 
    --auth=esp8266

; ────────────────────────────────────────────────────────────────────
; Waveshare ESP32-S3-Zero (ESP32-S3FH4R2 : 4MB Flash, 2MB QPI PSRAM)
; Board : lolin_s3_mini (ESP32-S3, pas de bootloader UF2 Adafruit)
; Flash manuel : maintenir BOOT + appuyer RESET pour entrer en mode flash
; ────────────────────────────────────────────────────────────────────
[env:esp32s3-zero]
platform = espressif32
board = lolin_s3_mini
framework = arduino
board_build.filesystem = littlefs
board_build.flash_size = 4MB
board_build.partitions = default.csv
; Désactiver le 1200bps touch Adafruit — utiliser ROM bootloader direct
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DFILTER_6W_SPIKES=1
    -DBWC_DEBUGGING=BWC_DEBUG_OUTPUT_SERIAL
    -DBWC_SPRINKLE_YIELDS
upload_speed = 921600
monitor_speed = 115200
extra_scripts = gzip_littlefs.py
lib_deps =
    bblanchon/ArduinoJson@6.21.2
    links2004/WebSockets
    knolleary/PubSubClient
    me-no-dev/AsyncTCP
    plerup/EspSoftwareSerial
    milesburton/DallasTemperature
; upload_protocol = esptool
upload_protocol = espota
upload_port = 192.168.90.160
upload_flags =
    --auth=esp8266
